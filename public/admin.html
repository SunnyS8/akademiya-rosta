<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Академия Роста — Админ-панель</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Jost',sans-serif;background:#F5F0E8;color:#3A3530;min-height:100vh}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(160deg,#2C3E35,#4E7153)}
.login-box{background:#FDFAF4;padding:3rem;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.3);max-width:400px;width:90%}
.login-box h2{font-family:'Cormorant Garamond',serif;font-size:2rem;color:#2C3E35;margin-bottom:.5rem}
.login-box p{color:#6E655C;margin-bottom:2rem}
.login-box input{width:100%;padding:.8rem 1rem;margin-bottom:1rem;border:2px solid rgba(42,56,48,.12);border-radius:8px;font-size:1rem;font-family:'Jost'}
.login-box input:focus{outline:none;border-color:#7A9E7E}
.login-box button{width:100%;padding:.8rem;background:#7A9E7E;color:#FDFAF4;border:none;border-radius:8px;font-size:1rem;font-family:'Jost';cursor:pointer;font-weight:500}
.login-box button:hover{background:#4E7153}
.login-box .error{color:#C4714A;font-size:.85rem;margin-bottom:1rem;display:none}
.dashboard{padding:2rem;max-width:960px;margin:0 auto}
.dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;padding-bottom:1rem;border-bottom:2px solid rgba(42,56,48,.12)}
.dash-header h1{font-family:'Cormorant Garamond',serif;font-size:1.8rem;color:#2C3E35}
.dash-header button{padding:.5rem 1rem;background:#C4714A;color:#FDFAF4;border:none;border-radius:8px;cursor:pointer;font-family:'Jost'}
.section{background:#FDFAF4;padding:1.5rem;border-radius:12px;margin-bottom:1.5rem;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.section h3{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:#2C3E35;margin-bottom:1rem}
.section label{display:block;font-size:.85rem;color:#6E655C;margin-bottom:.3rem;margin-top:1rem}
.section input,.section textarea,.section select{width:100%;padding:.6rem;border:2px solid rgba(42,56,48,.12);border-radius:8px;font-family:'Jost';font-size:.95rem;margin-bottom:.5rem}
.section input:focus,.section textarea:focus{outline:none;border-color:#7A9E7E}
.section textarea{min-height:80px;resize:vertical}
.btn-save{padding:.7rem 2rem;background:#7A9E7E;color:#FDFAF4;border:none;border-radius:8px;cursor:pointer;font-family:'Jost';font-weight:500}
.btn-save:hover{background:#4E7153}
.btn-danger{padding:.4rem .8rem;background:#C4714A;color:#FDFAF4;border:none;border-radius:6px;cursor:pointer;font-family:'Jost';font-size:.8rem}
.btn-add{padding:.5rem 1rem;background:#C9A84C;color:#2C3E35;border:none;border-radius:8px;cursor:pointer;font-family:'Jost';font-weight:500;margin-top:.5rem}
.btn-generate{padding:.7rem 1.5rem;background:#C9A84C;color:#2C3E35;border:none;border-radius:8px;cursor:pointer;font-family:'Jost';font-weight:500;margin-top:.5rem}
.program-item{background:#F5F0E8;padding:1rem;border-radius:8px;margin-bottom:.8rem;display:flex;justify-content:space-between;align-items:center}
.program-item h4{color:#2C3E35}
.program-item .meta{color:#6E655C;font-size:.85rem}
.tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap}
.tab{padding:.5rem 1.2rem;background:#E8E4DC;border:none;border-radius:8px;cursor:pointer;font-family:'Jost';font-weight:500;color:#3A3530}
.tab.active{background:#7A9E7E;color:#FDFAF4}
.msg{padding:.8rem;border-radius:8px;margin-bottom:1rem;display:none}
.msg.ok{background:#E8F5E9;color:#2E7D32;display:block}
.msg.err{background:#FFEBEE;color:#C62828;display:block}
.post-card{background:#F5F0E8;padding:1rem;border-radius:8px;margin-bottom:.8rem;border-left:4px solid #7A9E7E}
.post-card h4{color:#2C3E35;margin-bottom:.3rem}
.post-card p{color:#3A3530;font-size:.9rem;margin-bottom:.3rem}
.post-card .hashtags{color:#7A9E7E;font-size:.8rem}
.post-card .cta{color:#C4714A;font-size:.85rem;font-weight:500}
.gen-form{margin-bottom:1rem}
.gen-result{margin-top:1rem}
.loading{display:inline-block;width:20px;height:20px;border:3px solid #E8E4DC;border-top-color:#7A9E7E;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.brand-select{width:100%;padding:.6rem;border:2px solid rgba(42,56,48,.12);border-radius:8px;font-family:'Jost';font-size:.95rem;margin-bottom:.5rem}
</style>
</head>
<body>
<div id="loginScreen" class="login-wrap">
<div class="login-box">
<h2>Академия Роста</h2>
<p>Админ-панель · Вход</p>
<div class="error" id="loginErr">Неверный пароль</div>
<input type="password" id="adminPass" placeholder="Пароль" autocomplete="off">
<button onclick="doLogin()">Войти</button>
</div>
</div>

<div id="dashScreen" class="dashboard" style="display:none">
<div class="dash-header">
<h1>⚙️ Админ-панель</h1>
<button onclick="doLogout()">Выйти</button>
</div>
<div id="msgBox" class="msg"></div>

<div class="tabs">
<button class="tab active" onclick="showTab('content')">Контент</button>
<button class="tab" onclick="showTab('programs')">Программы</button>
<button class="tab" onclick="showTab('contacts')">Контакты</button>
<button class="tab" onclick="showTab('contentgen')">Генератор контента</button>
</div>

<div id="tab-content" class="section">
<h3>Настройки сайта</h3>
<label>Название бренда</label><input id="cBrand" placeholder="Академия Роста">
<label>Город</label><input id="cCity" placeholder="Ставрополь">
<label>Теглайн</label><input id="cTagline" placeholder="Тренинги и расстановки для тех, кто хочет жить лучше">
<label>Описание (meta)</label><textarea id="cDesc" placeholder="Мета-описание"></textarea>
<label>Телефон</label><input id="cPhone" placeholder="+7 (9624) 42-22-01">
<label>Email</label><input id="cEmail" placeholder="info@akademiya-rosta.ru">
<label>Адрес</label><input id="cAddress" placeholder="г. Ставрополь, пер. Рылеева, 7, 4 этаж">
<label>VK</label><input id="cVk" placeholder="https://vk.ru/grc_stavropol">
<label>Telegram</label><input id="cTg" placeholder="https://t.me/grc_stavropol">
<button class="btn-save" onclick="saveContent()" style="margin-top:1rem">Сохранить</button>
</div>

<div id="tab-programs" class="section" style="display:none">
<h3>Программы</h3>
<div id="progList"></div>
<button class="btn-add" onclick="addProg()">+ Добавить программу</button>
</div>

<div id="tab-contacts" class="section" style="display:none">
<h3>Контакты</h3>
<label>Телефон</label><input id="kPhone" placeholder="+7 (9624) 42-22-01">
<label>Email</label><input id="kEmail" placeholder="info@akademiya-rosta.ru">
<label>VK</label><input id="kVk" placeholder="vk.ru/grc_stavropol">
<label>Telegram</label><input id="kTg" placeholder="t.me/grc_stavropol">
<button class="btn-save" onclick="saveContacts()" style="margin-top:1rem">Сохранить</button>
</div>

<div id="tab-contentgen" class="section" style="display:none">
<h3>Генератор контента для соцсетей</h3>
<p style="color:#6E655C;font-size:.85rem;margin-bottom:1rem">Генерирует посты для ВК и Telegram через AI (Gemini). Используйте бренд-профиль и SEO-ключи из конфигурации.</p>
<div class="gen-form">
<label>Бренд</label>
<select class="brand-select" id="genBrand">
<option value="Академия Роста">Академия Роста</option>
<option value="Академия Роста — Ставрополь">Академия Роста — Ставрополь</option>
</select>
<label>Канал</label>
<select class="brand-select" id="genChannel">
<option value="vk">ВКонтакте</option>
<option value="telegram">Telegram</option>
<option value="both">ВК + Telegram</option>
</select>
<label>Тема поста</label>
<input id="genTopic" placeholder="Например: Как выбрать психологический тренинг" style="margin-bottom:.5rem">
<button class="btn-generate" onclick="generateContent()">⚡ Сгенерировать 5 постов</button>
<div id="genLoading" style="display:none;margin-top:1rem"><span class="loading"></span> Генерация через Gemini...</div>
</div>
<div id="genResult" class="gen-result"></div>
</div>

</div>

<script>
const API='';let token='';

async function doLogin(){
const pass=document.getElementById('adminPass').value;
const err=document.getElementById('loginErr');
try{
const r=await fetch(API+'/api/admin/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass})});
const j=await r.json();
if(j.ok){token=j.token;document.getElementById('loginScreen').style.display='none';document.getElementById('dashScreen').style.display='block';loadContent();}
else{err.style.display='block';}
}catch(e){err.style.display='block';}
}

function doLogout(){token='';document.getElementById('loginScreen').style.display='flex';document.getElementById('dashScreen').style.display='none';document.getElementById('adminPass').value='';}

function showTab(name){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.section').forEach(s=>s.style.display='none');event.target.classList.add('active');document.getElementById('tab-'+name).style.display='block';if(name==='contentgen')return;if(name==='content')loadContent();if(name==='programs')loadPrograms();}

function showMsg(text,type){const m=document.getElementById('msgBox');m.textContent=text;m.className='msg '+type;setTimeout(()=>{m.className='msg'},3000);}

async function loadContent(){
try{const r=await fetch(API+'/api/admin/content',{headers:{'Cookie':'admin_token='+token}});const j=await r.json();if(j.ok)fillForm(j.content);}catch(e){showMsg('Ошибка загрузки','err');}
}

function fillForm(c){const b=c.brand||{};const co=c.contacts||{};document.getElementById('cBrand').value=b.name||'';document.getElementById('cCity').value=b.city||'';document.getElementById('cTagline').value=b.tagline||'';document.getElementById('cDesc').value=b.description||'';document.getElementById('cPhone').value=co.phone||'';document.getElementById('cEmail').value=co.email||'';document.getElementById('cAddress').value=co.address||'';document.getElementById('cVk').value=co.vk||'';document.getElementById('cTg').value=co.telegram||'';}

async function saveContent(){const data={brand:{name:document.getElementById('cBrand').value,city:document.getElementById('cCity').value,tagline:document.getElementById('cTagline').value,description:document.getElementById('cDesc').value},contacts:{phone:document.getElementById('cPhone').value,email:document.getElementById('cEmail').value,address:document.getElementById('cAddress').value,vk:document.getElementById('cVk').value,telegram:document.getElementById('cTg').value}};try{const r=await fetch(API+'/api/admin/content',{method:'PUT',headers:{'Content-Type':'application/json','Cookie':'admin_token='+token},body:JSON.stringify(data)});const j=await r.json();showMsg(j.ok?'Сохранено ✅':'Ошибка',j.ok?'ok':'err');}catch(e){showMsg('Ошибка','err');}}

async function loadPrograms(){try{const r=await fetch(API+'/api/admin/programs',{headers:{'Cookie':'admin_token='+token}});const j=await r.json();if(j.ok)renderPrograms(j.programs);}catch(e){}}

function renderPrograms(progs){const list=document.getElementById('progList');list.innerHTML=progs.map(p=>`<div class="program-item"><div><h4>${p.name}</h4><div class="meta">${p.duration} · ${p.price}</div></div><div><button class="btn-danger" onclick="delProg(${p.id})">Удалить</button></div></div>`).join('');}

function showProgForm(p){const list=document.getElementById('progList');const item=document.createElement('div');item.className='program-item';item.innerHTML=`<div style="width:100%"><input value="${p.name||''}" id="pfName" placeholder="Название"><input value="${p.duration||''}" id="pfDuration" placeholder="Длительность"><input value="${p.price||''}" id="pfPrice" placeholder="Цена"><textarea id="pfDesc" placeholder="Описание">${p.desc||''}</textarea></div><div><button class="btn-save" onclick="saveProg(${p.id})">Сохранить</button></div>`;list.innerHTML='';list.appendChild(item);}

async function addProg(){const p={name:'Новая программа',duration:'3 дня',price:'28 000 ₽',desc:'',cat:'personal',id:Date.now()};try{const r=await fetch(API+'/api/admin/programs',{method:'POST',headers:{'Content-Type':'application/json','Cookie':'admin_token='+token},body:JSON.stringify(p)});const j=await r.json();if(j.ok){renderPrograms(j.programs);showProgForm(p);}}catch(e){}}

async function delProg(id){try{const r=await fetch(API+'/api/admin/programs',{method:'DELETE',headers:{'Content-Type':'application/json','Cookie':'admin_token='+token},body:JSON.stringify({id})});const j=await r.json();if(j.ok){renderPrograms(j.programs);showMsg('Удалено','ok');}}catch(e){}}

async function saveProg(id){const p={id,name:document.getElementById('pfName').value,duration:document.getElementById('pfDuration').value,price:document.getElementById('pfPrice').value,desc:document.getElementById('pfDesc').value};try{const r=await fetch(API+'/api/admin/programs',{method:'PUT',headers:{'Content-Type':'application/json','Cookie':'admin_token='+token},body:JSON.stringify(p)});const j=await r.json();if(j.ok){loadPrograms();showMsg('Сохранено ✅','ok');}}catch(e){}}

async function saveContacts(){const data={contacts:{phone:document.getElementById('kPhone').value,email:document.getElementById('kEmail').value,vk:document.getElementById('kVk').value,telegram:document.getElementById('kTg').value}};try{const r=await fetch(API+'/api/admin/content',{method:'PUT',headers:{'Content-Type':'application/json','Cookie':'admin_token='+token},body:JSON.stringify(data)});const j=await r.json();showMsg(j.ok?'Сохранено ✅':'Ошибка',j.ok?'ok':'err');}catch(e){showMsg('Ошибка','err');}}

async function generateContent(){
const topic=document.getElementById('genTopic').value.trim();
const brand=document.getElementById('genBrand').value;
const channel=document.getElementById('genChannel').value;
if(!topic){showMsg('Введите тему','err');return;}
document.getElementById('genLoading').style.display='block';
document.getElementById('genResult').innerHTML='';
try{
const r=await fetch(API+'/api/admin/content-gen',{method:'POST',headers:{'Content-Type':'application/json','Cookie':'admin_token='+token},body:JSON.stringify({brand:{name:brand},topic,channel})});
const j=await r.json();
document.getElementById('genLoading').style.display='none';
if(j.ok&&j.posts){
let html='<h3 style="font-family:Cormorant Garamond,serif;color:#2C3E35;margin-bottom:1rem">Готово — 5 постов</h3>';
j.posts.forEach((p,i)=>{
html+=`<div class="post-card"><h4>${i+1}. ${p.title}</h4><p>${p.text}</p><div class="hashtags">${p.hashtags}</div><div class="cta">${p.cta}</div></div>`;
});
document.getElementById('genResult').innerHTML=html;
}else{showMsg('Ошибка генерации','err');}
}catch(e){document.getElementById('genLoading').style.display='none';showMsg('Ошибка сети','err');}
}
</script>
</body>
</html>
